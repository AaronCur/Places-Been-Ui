# Weekly update PRs: one for npm, one for GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Angular majors are done by hand with `ng update`: it moves every Angular package and TypeScript together
    # and runs the code migrations. A Dependabot PR bumping one package to a new major can never install,
    # because the other packages' peer dependencies still pin the old major.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Each Angular version supports a fixed TypeScript range; `ng update` bumps it when Angular does
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Everything the ignore rules allow, majors included, in one PR. If CI goes red, the failing package is
    # usually the major bump; drop it with `@dependabot ignore <package> major version` and the PR rebuilds.
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
