<mat-accordion displayMode="flat">
  @for (country of countries(); track country.id) {
    <mat-expansion-panel
      [attr.data-country]="country.isoCode"
      [expanded]="selected() === country.isoCode"
      (expandedChange)="toggled(country.isoCode, $event)"
    >
      <mat-expansion-panel-header>
        <mat-panel-title>
          <app-flag [code]="country.isoCode" />
          <span class="name">{{ country.name }}</span>
        </mat-panel-title>
        <mat-panel-description>
          {{ country.cities?.length ?? 0 | i18nPlural: cityCount }}
        </mat-panel-description>
      </mat-expansion-panel-header>

      <ul class="cities">
        @for (city of country.cities; track city.id) {
          @let label = labels().get(city.id) ?? city.name;
          <li #row class="city">
            <mat-icon class="pin" aria-hidden="true">location_on</mat-icon>
            <span class="city-name">{{ label }}</span>
            <button
              mat-icon-button
              type="button"
              [attr.aria-label]="'Delete ' + label"
              (click)="askToDelete({ city, country }, row)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </li>
        }
      </ul>
    </mat-expansion-panel>
  }
</mat-accordion>
